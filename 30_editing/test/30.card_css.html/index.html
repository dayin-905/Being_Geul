<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 카드 갤러리</title>
    
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="css/card-hover.css">

    <div class="container">
        <h1>포켓몬 카드 컬렉션</h1>
        
        <div id="card_wrap">
            <!-- 카드 1 -->
            <div class="card">

                <a href="#card4">

                </a>
            </div>
            
            <!-- 카드 5 -->
            <div class="card">
                <a href="#card5">
                    <img src="images/card5.png" alt="버터플">
                </a>
            </div>
            
            <!-- 카드 6 -->
            <div class="card">
                <a href="#card6">

            <!-- 필요한 만큼 카드 추가 -->
        </div>

    <!-- JavaScript 파일 연결 -->
    <script src="js/card-animation.js"></script>

</html>
